name: Agricultura API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera los builds cacheando dependencias

      # Tu proyecto tiene OpenCV (PlantCV), se requiere de las libs del sistema para correr tests
      - name: Install system dependencies (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx # Asegurar que pytest y el cliente async estén presentes

      # Modifica este paso si instalas un testing suite más tarde (como pytest)
      # Ahora mismo corre el test rápido de consola:
      - name: Run test_api script
        run: python test_api.py

