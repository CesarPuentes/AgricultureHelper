{% extends "base.html" %}

{% block content %}
<div class="tabs">
    <input type="radio" name="tabs" id="tab1" {% if active_tab !='sensors' and active_tab !='alerts' %}checked{% endif
        %}>
    <label for="tab1">📸 Vision Lab Demo</label>
    <div class="tab">
        {% include 'includes/vision_tab.j2' %}
        {% include 'includes/vision_results.j2' %}
    </div>

    <!-- Sensor Lab Tab -->
    <input type="radio" name="tabs" id="tab2" {% if active_tab=='sensors' %}checked{% endif %}>
    <label for="tab2">📟 Sensor Lab</label>
    <div class="tab">
        {% include 'includes/sensor_tab.j2' %}
    </div>
</div>

<script>
    const S = {
        counting: [["conteo_4x6", "Conteo (4×6)"]],
        disease: [["disease_1", "Disease Sample"]],
        anomaly: [["chlorosis_set", "Chlorosis Set"], ["disease_set", "Disease Set"], ["healthy_set", "Healthy Baseline"]]
    };
    function updateSets() { const s = document.getElementById('demo-set'); s.innerHTML = S[document.getElementById('demo-type').value].map(x => `<option value="${x[0]}">${x[1]}</option>`).join('') }
    updateSets();
    function clearIfResults() { const rc = document.getElementById('results-container'); if (rc) rc.style.display = 'none'; }
    document.getElementById('demo-type').addEventListener('change', function () { updateSets(); clearIfResults(); });
    document.getElementById('analysis-type').addEventListener('change', clearIfResults);

    // Show loading overlay on form submissions
    document.querySelectorAll('form').forEach(form => {
        form.addEventListener('submit', function () {
            // Only show for analysis/demo forms, not necessarily for simple sensor configs
            const action = this.getAttribute('action');
            if (action.includes('analyze') || action.includes('demo')) {
                document.getElementById('loading-overlay').style.setProperty('display', 'flex', 'important');
            }
        });
    });
</script>
{% endblock %}
